<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Bakery - Customer Order</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f3ee;color:#333}
header{background:#6d3b1f;color:white;text-align:center;padding:18px}
.container{max-width:1100px;margin:auto;padding:15px}
.card{background:white;padding:15px;margin-bottom:15px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.item{border:1px solid #ddd;border-radius:10px;padding:12px;background:#fff;display:flex;flex-direction:column;justify-content:space-between}
.item button{width:100%;border:0;background:#6d3b1f;color:white;padding:10px;border-radius:7px;cursor:pointer}
.price{color:#a44c20;font-weight:bold;margin:7px 0}
.cart-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.qty button{width:32px;height:32px;border:0;border-radius:5px;background:#ddd;cursor:pointer;font-size:18px}
.total{font-size:22px;font-weight:bold;color:#6d3b1f}
.primary{background:#198754;color:white;border:0;padding:13px 20px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%}
.empty{text-align:center;color:#777;padding:20px}
.table-box{background:#fff3df;padding:12px;border-radius:8px;margin-bottom:15px;text-align:center;font-weight:bold;font-size:18px;color:#6d3b1f}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<header>
    <h1 style="margin:0;">🍰 Best Bakery</h1>
    <p style="margin:5px 0 0 0;">Online Ordering Menu</p>
</header>

<div class="container">
    <div class="table-box">
        🪑 Table <span id="tableNumber">1</span>
    </div>

    <div id="menuArea"></div>

    <div class="card">
        <h2>🛒 Your Order</h2>
        <div id="cartArea"><div class="empty">Cart is empty</div></div>
        <hr>
        <div class="total">Total: ₹<span id="cartTotal">0</span></div>
        <br>
        <button class="primary" onclick="placeOrder()">Place Order</button>
    </div>

    <div class="card">
        <h2>📋 Order Status</h2>
        <div id="orderStatus">No active order.</div>
    </div>
</div>

<script>
// Firebase Config (നിങ്ങളുടെ ഫയർബേസ് വിവരങ്ങൾ ഇവിടെ നൽകുക)
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// Table Number Detection from URL Parameter
const params = new URLSearchParams(window.location.search);
let table = params.get("table") || "1";
if(!["1","2","3","4"].includes(table)){ table = "1"; }
document.getElementById("tableNumber").textContent = table;

const menu = {
    "Fresh Juice": [["Orange",70], ["Musambi",70], ["Pineapple",70]],
    "Milk Shakes": [["Chikku",70], ["Mango",90], ["Avocado",100]],
    "Hot Beverages": [["Tea",15], ["Coffee",25]],
    "Snacks": [["Chicken Puffs",20], ["Cutlet",20], ["Samosa",12]]
};

let cart = {};

function renderMenu(){
    const menuArea = document.getElementById("menuArea");
    menuArea.innerHTML = "";
    Object.keys(menu).forEach(category => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<h2>${category}</h2>`;
        const grid = document.createElement("div");
        grid.className = "grid";
        
        menu[category].forEach(item => {
            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `<b>${item[0]}</b><div class="price">₹${item[1]}</div>`;
            const btn = document.createElement("button");
            btn.textContent = "Add";
            btn.onclick = () => addToCart(item[0], item[1]);
            div.appendChild(btn);
            grid.appendChild(div);
        });
        card.appendChild(grid);
        menuArea.appendChild(card);
    });
}

function addToCart(name, price){
    if(!cart[name]) cart[name] = { name, price, qty: 0 };
    cart[name].qty++;
    renderCart();
}

function changeQty(name, val){
    if(!cart[name]) return;
    cart[name].qty += val;
    if(cart[name].qty <= 0) delete cart[name];
    renderCart();
}

function renderCart(){
    const cartArea = document.getElementById("cartArea");
    const cartTotal = document.getElementById("cartTotal");
    const items = Object.values(cart);
    
    if(items.length === 0){
        cartArea.innerHTML = `<div class="empty">Cart is empty</div>`;
        cartTotal.textContent = "0";
        return;
    }
    
    cartArea.innerHTML = "";
    let total = 0;
    items.forEach(item => {
        total += item.price * item.qty;
        const row = document.createElement("div");
        row.className = "cart-row";
        row.innerHTML = `
            <div><strong>${item.name}</strong><br>₹${item.price} × ${item.qty}</div>
            <div class="qty">
                <button onclick="changeQty('${item.name}', -1)">−</button>
                <span>${item.qty}</span>
                <button onclick="changeQty('${item.name}', 1)">+</button>
            </div>
            <b>₹${item.price * item.qty}</b>
        `;
        cartArea.appendChild(row);
    });
    cartTotal.textContent = total;
}

function placeOrder(){
    const items = Object.values(cart);
    if(items.length === 0){ alert("Please select items first."); return; }

    const orderId = "ORD-" + Date.now().toString().slice(-5);
    let total = items.reduce((sum, item) => sum + (item.price * item.qty), 0);

    const orderData = {
        orderId: orderId,
        table: table,
        items: items,
        total: total,
        status: "Pending",
        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
    };

    // Push to Firebase Realtime Database
    database.ref('orders/' + orderId).set(orderData)
    .then(() => {
        document.getElementById("orderStatus").innerHTML = `
            <p><strong>Order No:</strong> ${orderId}</p>
            <p><strong>Table:</strong> ${table}</p>
            <p><strong>Total:</strong> ₹${total}</p>
            <p><strong>Status:</strong> 🟡 Pending</p>
        `;
        cart = {};
        renderCart();
        alert("✅ Order Sent to Kitchen!");
    })
    .catch(err => alert("Error submitting order: " + err.message));
}

renderMenu();
</script>
</body>
</html>
