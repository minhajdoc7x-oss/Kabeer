<!DOCTYPE html>
<html>
<head>
<title>Kabeer Mobile CV</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: #eef2f3;
    padding: 10px;
}

/* FORM */
.form {
    background: white;
    padding: 15px;
    border-radius: 10px;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    background: #111;
    color: white;
    border: none;
    border-radius: 8px;
}

/* CV */
#cv {
    display: none;
    background: white;
    margin-top: 15px;
    border-radius: 10px;
    overflow: hidden;
}

/* TOP (mobile layout) */
.top {
    background: #111;
    color: white;
    text-align: center;
    padding: 20px;
}

.top img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid white;
    object-fit: cover;
}

.top h2 {
    margin: 10px 0 5px;
}

/* CONTENT */
.content {
    padding: 15px;
}

.section {
    margin-bottom: 15px;
}

.section h3 {
    border-bottom: 2px solid #111;
    padding-bottom: 5px;
}

/* FOOTER */
.footer {
    text-align: center;
    font-size: 12px;
    color: gray;
    padding: 10px;
}

/* DESKTOP STYLE AUTO */
@media(min-width:768px){
    #cv {
        display: flex;
    }

    .top {
        width: 30%;
    }

    .content {
        width: 70%;
    }
}
</style>
</head>

<body>

<h2>📱 Kabeer CV Maker</h2>

<div class="form">
    <input type="text" id="name" placeholder="Name">
    <input type="text" id="phone" placeholder="Phone">
    <input type="email" id="email" placeholder="Email">
    <textarea id="address" placeholder="Address"></textarea>
    <textarea id="education" placeholder="Education"></textarea>
    <textarea id="skills" placeholder="Skills"></textarea>
    <textarea id="experience" placeholder="Experience"></textarea>

    <input type="file" id="photo">

    <button onclick="generateCV()">Generate CV</button>
</div>

<div id="cv">
    <div class="top">
        <img id="cvPhoto">
        <h2 id="cvName"></h2>
        <p id="cvPhone"></p>
        <p id="cvEmail"></p>
    </div>

    <div class="content">
        <div class="section">
            <h3>Address</h3>
            <p id="cvAddress"></p>
        </div>

        <div class="section">
            <h3>Education</h3>
            <p id="cvEducation"></p>
        </div>

        <div class="section">
            <h3>Skills</h3>
            <p id="cvSkills"></p>
        </div>

        <div class="section">
            <h3>Experience</h3>
            <p id="cvExperience"></p>
        </div>

        <button onclick="downloadPDF()">Download PDF</button>
    </div>
</div>

<div class="footer">© Kabeer</div>

<script>
function generateCV(){
    document.getElementById("cv").style.display = "block";

    cvName.innerText = name.value;
    cvPhone.innerText = phone.value;
    cvEmail.innerText = email.value;
    cvAddress.innerText = address.value;
    cvEducation.innerText = education.value;
    cvSkills.innerText = skills.value;
    cvExperience.innerText = experience.value;

    let file = photo.files[0];
    if(file){
        let reader = new FileReader();
        reader.onload = function(e){
            cvPhoto.src = e.target.result;
        }
        reader.readAsDataURL(file);
    }
}

function downloadPDF(){
    html2pdf().from(document.getElementById("cv")).save("Kabeer_CV.pdf");
}
</script>

</body>
</html>
